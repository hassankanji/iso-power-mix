name: Daily ISO generation-mix pull

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC = 9am ET / 6am PT, daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pull-and-commit:
    runs-on: ubuntu-latest
    # The very first run backfills full history per ISO (years of data) and can take much
    # longer than the routine daily incremental pull; subsequent runs are fast.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (pulls prior day for all 7 ISOs, upserts, exports dashboard JSON)
        id: pipeline
        env:
          PJM_SUBSCRIPTION_KEY: ${{ secrets.PJM_SUBSCRIPTION_KEY }}
          MISO_API_KEY: ${{ secrets.MISO_API_KEY }}
          ISONE_USERNAME: ${{ secrets.ISONE_USERNAME }}
          ISONE_PASSWORD: ${{ secrets.ISONE_PASSWORD }}
        run: python scripts/run_pipeline.py
        continue-on-error: true

      - name: Flag partial failure
        if: steps.pipeline.outcome == 'failure'
        run: echo "::warning::One or more ISOs failed to fetch today - see the 'Run pipeline' step log. Whatever data did succeed will still be committed below."

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/power_mix.duckdb docs/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily ISO generation-mix update ($(date -u +%Y-%m-%d))"
            git push
          fi

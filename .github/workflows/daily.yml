name: Daily ISO generation-mix pull

on:
  schedule:
    # GitHub reliably delays cron starts by ~30-90 min, so these are set
    # earlier than the desired wall time. Morning pull targets ~9am ET;
    # the afternoon pass picks up late-published data and the current day.
    - cron: "0 12 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      iso:
        description: "Comma-separated ISO codes to run (blank = all)"
        required: false
        default: ""
      start:
        description: "Force start date YYYY-MM-DD (blank = incremental; use for re-backfills)"
        required: false
        default: ""
      end:
        description: "Force end date YYYY-MM-DD (blank = yesterday)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  pull-and-commit:
    runs-on: ubuntu-latest
    # Routine daily runs finish in minutes; a forced full re-backfill of a
    # request-per-day ISO (CAISO, ISO-NE) can take hours.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The DuckDB file is not committed (see README - Sustainability); the
      # pipeline rebuilds it from the committed docs/data/iso_daily_*.json
      # exports on this fresh checkout, then pulls the newest days, repairs
      # any gaps it can (ISO source first, EIA-930 as fallback), refreshes
      # the US48 national reference, and regenerates the exports. A non-zero
      # exit means a real fetch failure or stale data (missing credentials
      # only produce a "skipped" notice) - the job goes red so GitHub emails
      # a notification, but whatever data DID succeed is still committed by
      # the next step.
      - name: Run pipeline
        env:
          # Fallbacks tolerate the secret being saved under a near-miss name.
          PJM_SUBSCRIPTION_KEY: ${{ secrets.PJM_SUBSCRIPTION_KEY || secrets.PJM_API_KEY || secrets.PJM_KEY }}
          MISO_API_KEY: ${{ secrets.MISO_API_KEY }}
          ISONE_USERNAME: ${{ secrets.ISONE_USERNAME }}
          ISONE_PASSWORD: ${{ secrets.ISONE_PASSWORD }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.iso }}" ]; then ARGS="$ARGS --iso ${{ github.event.inputs.iso }}"; fi
          if [ -n "${{ github.event.inputs.start }}" ]; then ARGS="$ARGS --start ${{ github.event.inputs.start }}"; fi
          if [ -n "${{ github.event.inputs.end }}" ]; then ARGS="$ARGS --end ${{ github.event.inputs.end }}"; fi
          python scripts/run_pipeline.py $ARGS

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily ISO generation-mix update ($(date -u +%Y-%m-%d))"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

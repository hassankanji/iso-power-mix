name: Reconcile vs EIA-930

# Manual sanity check: compares our per-ISO daily totals against EIA's
# independent measurements and commits docs/data/reconciliation.json.
# Needs the EIA_API_KEY secret. Run it after any connector change, or
# whenever the numbers feel off.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Trailing full days to compare"
        required: false
        default: "30"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reconcile
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/reconcile_eia.py --days ${{ github.event.inputs.days }}

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/reconciliation.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "EIA-930 reconciliation report"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
